services:
  db:
    image: postgres:15-alpine
    container_name: elibrary_db
    environment:
      POSTGRES_DB: ${DB_NAME:-elibrary}
      POSTGRES_USER: ${DB_USER:-elibrary_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_change_this}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-elibrary_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - elibrary_network

  redis:
    image: redis:7-alpine
    container_name: elibrary_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - elibrary_network

  web:
    build: .
    container_name: elibrary_web
    command: >
      sh -c "python manage.py migrate --noinput --settings=elibrary.settings_production &&
             python manage.py collectstatic --noinput --settings=elibrary.settings_production &&
             gunicorn --bind 0.0.0.0:8000 --workers 4 --timeout 60 elibrary.wsgi:application"
    env_file:
      - path: .env.production
        format: raw
    environment:
      DJANGO_SETTINGS_MODULE: elibrary.settings_production
      DB_HOST: db
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/var/log/elibrary
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - elibrary_network

  celery_worker:
    build: .
    container_name: elibrary_celery_worker
    command: celery -A elibrary worker --loglevel=INFO
    env_file:
      - path: .env.production
        format: raw
    environment:
      DJANGO_SETTINGS_MODULE: elibrary.settings_production
      DB_HOST: db
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - .:/app
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - elibrary_network

  celery_beat:
    build: .
    container_name: elibrary_celery_beat
    command: celery -A elibrary beat --loglevel=INFO
    env_file:
      - path: .env.production
        format: raw
    environment:
      DJANGO_SETTINGS_MODULE: elibrary.settings_production
      DB_HOST: db
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - elibrary_network

  nginx:
    image: nginx:alpine
    container_name: elibrary_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    networks:
      - elibrary_network

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  logs_volume:

networks:
  elibrary_network:
    driver: bridge
