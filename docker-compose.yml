version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: elibrary_db
    environment:
      POSTGRES_DB: ${DB_NAME:-elibrary}
      POSTGRES_USER: ${DB_USER:-elibrary_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_change_this}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-elibrary_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - elibrary_network

  web:
    build: .
    container_name: elibrary_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 4 --timeout 60 elibrary.wsgi:application"
    environment:
      - DEBUG=${DEBUG:-False}
      - DATABASE_URL=postgresql://${DB_USER:-elibrary_user}:${DB_PASSWORD:-secure_password_change_this}@db:5432/${DB_NAME:-elibrary}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - SECRET_KEY=${SECRET_KEY:-change-this-to-random-secret-key}
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - elibrary_network

  nginx:
    image: nginx:alpine
    container_name: elibrary_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    networks:
      - elibrary_network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  elibrary_network:
    driver: bridge
