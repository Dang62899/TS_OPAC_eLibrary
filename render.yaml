services:
  - type: web
    name: ts-elibrary
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn elibrary.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /accounts/login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "False"
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ts-elibrary-db
          property: connectionString
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: ts-elibrary-db
    plan: free
